name: Docker Image CI Backend

on:
  push:
    branches: [ "main" ]
    paths:
      - backend

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Troca para a pasta do backend
      run: cd backend
    - name: Constrói a imagem do Docker do backend
      run: docker build . --tag sindcomb-backend:$(date +%s)
