name: Docker Image CI Backend

on:
  push:
    branches: [ "main" ]
    paths:
      - frontend

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Troca para a pasta do frontend
      run: cd frontend
    - name: Constrói a imagem do Docker do frontend
      run: docker build . --tag sindcomb-frontend:$(date +%s)
