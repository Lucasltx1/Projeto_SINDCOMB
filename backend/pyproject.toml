[project]
name = "sindcomb-backend"
version = "0.1.0"
description = "API do Sistema de Acompanhamento Processual do SINDCOMB"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "alembic>=1.14,<2.0",
    "cryptography>=43,<47",
    "openai>=1.75,<3.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "python-docx>=1.1,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "reportlab>=4.2,<5.0",
    "redis>=5.2,<7.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.uv]
package = false
